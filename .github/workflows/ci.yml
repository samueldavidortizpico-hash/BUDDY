name: CI

# Solo valida: no despliega, no compila con EAS, no publica y no usa secretos.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [develop, main]

# Mínimo necesario: el token solo puede leer el repositorio (no hace merge ni escribe).
permissions:
  contents: read

# Un envío nuevo a la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    name: Validar (tipos, lint y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Expo SDK 58 y React Native 0.88 exigen Node ^22.13 || ^24.3 (engines en node_modules).
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # Los pasos siguientes corren aunque uno falle, para ver todos los problemas de una vez.
      # El trabajo termina en rojo si cualquiera falla.
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Encabezados de pantallas
        if: ${{ !cancelled() }}
        run: npm run check:headers

      - name: Pruebas (Jest)
        if: ${{ !cancelled() }}
        run: npm test -- --ci --runInBand
